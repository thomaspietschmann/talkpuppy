name: Release

# Triggered by pushing a version tag, e.g. git tag v0.0.2 && git push origin v0.0.2
# The signed APKs end up on a GitHub Release, which Obtainium tracks.
on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Parse version from the tag (strips the leading "v") and derive a
      # versionCode: major*10000 + minor*100 + patch.
      - name: Version from tag
        id: v
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          IFS='.' read -r major minor patch <<< "$TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + ${patch:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Tests
        run: flutter test

      # Decode the base64-encoded keystore secret to a temp file
      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # One APK per CPU architecture keeps downloads small (the native
      # ONNX Runtime libraries dominate the size); Obtainium picks the one
      # matching the phone.
      - name: Build signed release APKs
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.v.outputs.name }} \
            --build-number=${{ steps.v.outputs.code }}

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app-$abi-release.apk" "Talkpuppy-${{ steps.v.outputs.name }}-$abi.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Talkpuppy ${{ steps.v.outputs.name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/Talkpuppy-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
