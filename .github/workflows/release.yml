name: Release

# Triggered by pushing a version tag, e.g. git tag v0.0.2 && git push origin v0.0.2
# The signed APKs end up on a GitHub Release, which Obtainium tracks.
on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Parse version from the tag (strips the leading "v") and derive a
      # versionCode: major*10000 + minor*100 + patch. The tag is validated
      # first, since it ends up in shell arithmetic and file names. The
      # build number in pubspec.yaml must match (F-Droid reads it there).
      - name: Version from tag
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v([0-9]{1,3})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag '$REF_NAME' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          name="$major.$minor.$patch"
          code=$(( major * 10000 + minor * 100 + patch ))
          expected="version: $name+$code"
          if ! grep -qx "$expected" pubspec.yaml; then
            echo "::error::pubspec.yaml must contain '$expected'"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Tests
        run: flutter test

      # Decode the base64-encoded keystore secret to a temp file
      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # One APK per CPU architecture keeps downloads small (the native
      # ONNX Runtime libraries dominate the size); Obtainium picks the one
      # matching the phone.
      - name: Build signed release APKs
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          BUILD_NAME: ${{ steps.v.outputs.name }}
          BUILD_NUMBER: ${{ steps.v.outputs.code }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      # Nothing after this needs the key; don't leave it on the runner
      # while third-party actions run.
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APKs
        env:
          BUILD_NAME: ${{ steps.v.outputs.name }}
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app-$abi-release.apk" "Talkpuppy-$BUILD_NAME-$abi.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Talkpuppy ${{ steps.v.outputs.name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/Talkpuppy-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
